<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Nova Commerce!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1a1a1a; background-color: #f5f5f5; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; }
    .header { text-align: center; padding-bottom: 2rem; border-bottom: 2px solid #667eea; margin-bottom: 2rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: -2rem -2rem 2rem -2rem; padding: 3rem 2rem; }
    .logo { font-size: 2rem; font-weight: 700; color: white; }
    .greeting { font-size: 1.5rem; margin-bottom: 1.5rem; }
    .message { margin-bottom: 2rem; color: #444; line-height: 1.8; }
    .cta-button { display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1rem 2.5rem; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 1.1rem; text-align: center; margin: 1.5rem 0; }
    .footer { margin-top: 3rem; padding-top: 2rem; border-top: 2px solid #e5e5e5; text-align: center; color: #666; font-size: 0.875rem; }
    @media (max-width: 600px) { .container { padding: 1rem; } .header { margin: -1rem -1rem 1.5rem -1rem; padding: 2rem 1rem; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🎉 Welcome!</div>
    </div>
    <div class="greeting">Hi {{userName}},</div>
    <div class="message">
      Welcome to Nova Commerce! We're excited to have you as part of our community. Start exploring amazing products from our curated stores.
    </div>
    <div style="text-align: center;">
      <a href="{{shopUrl}}" class="cta-button">Start Shopping</a>
    </div>
    <div class="footer">
      <p>&copy; {{currentYear}} {{companyName}}. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
