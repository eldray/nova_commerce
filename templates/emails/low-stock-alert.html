<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low Stock Alert</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1a1a1a; background-color: #f5f5f5; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; }
    .header { text-align: center; padding-bottom: 2rem; border-bottom: 2px solid #667eea; margin-bottom: 2rem; }
    .logo { font-size: 2rem; font-weight: 700; color: #667eea; }
    .alert-box { background: #fff3cd; border-left: 4px solid #ffc107; padding: 1.5rem; border-radius: 4px; margin: 2rem 0; }
    .product-info { background: #f9f9f9; padding: 1.5rem; border-radius: 8px; margin: 1.5rem 0; }
    .stock-level { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #e5e5e5; }
    .stock-bar { width: 100%; height: 10px; background: #e5e5e5; border-radius: 5px; overflow: hidden; margin: 1rem 0; }
    .stock-fill { height: 100%; background: linear-gradient(90deg, #dc3545, #ffc107); border-radius: 5px; }
    .cta-button { display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1rem 2.5rem; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 1.1rem; text-align: center; margin: 1.5rem 0; }
    .footer { margin-top: 3rem; padding-top: 2rem; border-top: 2px solid #e5e5e5; text-align: center; color: #666; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><div class="logo">⚠️ Low Stock Alert</div></div>
    <div style="font-size: 1.25rem; margin-bottom: 1rem;">Hi there,</div>
    <div class="alert-box">
      <p><strong>{{productName}}</strong> is running low on inventory!</p>
    </div>
    <div class="product-info">
      <div class="stock-level">
        <span>Current Stock:</span>
        <span style="font-size: 1.5rem; font-weight: 700; color: #dc3545;">{{currentStock}} units</span>
      </div>
      <div class="stock-level">
        <span>Reorder Threshold:</span>
        <span>{{threshold}} units</span>
      </div>
      <div class="stock-bar">
        <div class="stock-fill" style="width: {{currentStock}}%;"></div>
      </div>
      <p style="color: #666; font-size: 0.9rem; margin-top: 1rem;">
        We recommend restocking soon to avoid stockouts and lost sales.
      </p>
    </div>
    <div style="text-align: center;">
      <a href="{{productUrl}}" class="cta-button">Manage Inventory</a>
    </div>
    <div class="footer">
      <p>Store: {{storeName}} | &copy; {{currentYear}} {{companyName}}</p>
    </div>
  </div>
</body>
</html>
